# --- CPU & Performance (AMD Ryzen AI / Zen 5) ---
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

# Energy Performance Preference (EPP)
# 'balance_performance' for AC, 'power' for Battery to keep CPU in efficient V/F curve
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Scaling Governor
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Turbo Boost: Disable on battery to significantly reduce heat/power draw
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Platform Profiles (ACPI) ---
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# --- ThinkPad Battery Health (User's specific thresholds) ---
START_CHARGE_THRESH_BAT0=50
STOP_CHARGE_THRESH_BAT0=65

# --- Graphics & Peripherals ---
# Radeon iGPU Power Management
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery

# PCIe ASPM (Active State Power Management)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave

# Wi-Fi Power Saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- Radio Wizard (tlp-rdw) ---
DEVICES_TO_DISABLE_ON_LAN_CONNECT="wifi wwan"
DEVICES_TO_ENABLE_ON_LAN_DISCONNECT="wifi wwan"
