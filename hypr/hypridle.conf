general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh       # dbus/sysd lock command (used by loginctl lock-session)
    before_sleep_cmd = loginctl lock-session; rfkill block bluetooth    # lock before suspend and block bluetooth.
    after_sleep_cmd = hyprctl dispatch dpms on; rfkill unblock bluetooth  # to avoid having to press a key twice to turn on the display and unblock bluetooth.
}

listener {
    timeout = 300                                # 5min
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected
}
