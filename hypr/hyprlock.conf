general {
    no_fade_in = false
    disable_loading = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/alex/pictures/wallpapers/sf26.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 8
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = rgb(FFFFFF)
    fade_on_empty = true
    placeholder_text = <i>Password or Fingerprint...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = Inter 
    position = 0, 80
    halign = center
    valign = center
}
